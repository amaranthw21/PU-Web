<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RP Lore Archive</title>
    <!--
      GitHub Pages no reescribe rutas del lado del servidor, así que cualquier
      enlace profundo (p. ej. /PU-Web/factions/mobius) cae aquí. Este script
      codifica la ruta en la query y redirige a index.html, que la restaura.
      pathSegmentsToKeep = 1 porque el sitio vive bajo /PU-Web/.
      Ver https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
