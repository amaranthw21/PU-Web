# CMS configuration (Sveltia / Decap-compatible).
# Defines where the data comes from and goes to, and which forms the mods see.

backend:
  name: github
  repo: amaranthw21/PU-Web
  branch: main
  # OAuth broker (Cloudflare Worker) that handles the "Sign In with GitHub" flow.
  base_url: https://pu-web-cms-auth.amaranthw21.workers.dev

# Nota: `local_backend` y `locale` no existen en Sveltia CMS (los ignora y avisa
# por consola), así que no se declaran aquí. Para editar en local se usa el botón
# "Work with Local Repository", que sale solo en localhost. El idioma del panel
# lo toma del navegador.

# Default folder where images are uploaded (each collection overrides it
# with its own subfolder below).
media_folder: public
public_folder: /

collections:
  # ───────────────────────── Species ─────────────────────────
  - name: species
    label: Species
    label_singular: Species
    folder: src/content/species
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/species
    public_folder: /species
    fields:
      - { name: order, label: Order, widget: number, value_type: int, hint: "Position in the list (number)" }
      - { name: group, label: Group, widget: string, default: companion }
      - { name: name, label: Name, widget: string }
      - { name: image, label: Image, widget: image, required: false }
      - { name: summary, label: Summary, widget: text, required: false }
      - { name: description, label: Description, widget: text, required: false }

  # ───────────────────────── Factions ─────────────────────────
  - name: factions
    label: Factions
    label_singular: Faction
    folder: src/content/factions
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/factions
    public_folder: /factions
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - name: group
        label: Group
        widget: select
        options: [main, side, custom]
        default: main
      - { name: name, label: Name, widget: string }
      - { name: image, label: Main image, widget: image, required: false }
      - { name: imageFolder, label: "Image folder (optional)", widget: string, required: false }
      - { name: placeholderImage, label: "Placeholder image (optional)", widget: image, required: false }
      - name: factionGroups
        label: Faction subgroups
        widget: list
        required: false
        label_singular: Subgroup
        summary: "{{fields.label}} ({{fields.count}})"
        fields:
          - { name: id, label: ID, widget: string }
          - { name: label, label: Label, widget: string }
          - { name: placeholderLabel, label: "Placeholder label", widget: string }
          - { name: count, label: Count, widget: number, value_type: int }

  # ───────────────────────── Gods ─────────────────────────
  - name: gods
    label: Gods
    label_singular: God
    folder: src/content/gods
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/gods
    public_folder: /gods
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - name: category
        label: Category
        widget: select
        options: [mobius, moebius, sol, other]
        default: mobius
      - { name: name, label: Name, widget: string }
      - { name: domain, label: Domain, widget: string, required: false, hint: "First row of the Basic Information box." }
      - { name: description, label: Description, widget: text, required: false, hint: "Intro of this entry's own page, above the sections. Leave a blank line between paragraphs." }
      - { name: image, label: Image, widget: image, required: false }
      - { name: imagePosition, label: "Image position (CSS object-position)", widget: string, required: false, hint: "e.g. '30% center'" }
      - { name: imageZoom, label: "Image zoom", widget: number, value_type: float, required: false, hint: "e.g. 1.2" }
      - { name: color, label: "Accent color", widget: color, required: false, hint: "Tints the frame, the name and the Basic Information box on this god's own page. Empty keeps the site's magenta." }

      # ── Heraldos: los seres que hablan por el dios ──
      # Se pintan dentro del Basic Information, de dos en dos por fila.
      - name: harbingers
        label: Harbingers
        widget: list
        required: false
        label_singular: Harbinger
        summary: "{{fields.name}}"
        hint: "The beings who speak for this god. Shown at the bottom of the Basic Information box, two per row."
        fields:
          - { name: name, label: Name, widget: string, hint: "Shown under the picture." }
          - { name: image, label: Image, widget: image, required: false }
          - { name: imagePosition, label: "Image position (CSS object-position)", widget: string, required: false, hint: "Moves the picture inside its frame, e.g. 'center 20%' to show the head." }
          - { name: imageZoom, label: "Image zoom", widget: number, value_type: float, required: false, hint: "e.g. 1.2" }

      # ── Filas extra del Basic Information ──
      # Gods y Countries comparten este campo: se define aquí y Countries lo
      # reutiliza con *extra_info.
      - &extra_info
        name: extraInfo
        label: Extra rows
        widget: list
        required: false
        label_singular: Row
        summary: "{{fields.label}}: {{fields.value}}"
        hint: "Extra rows added to the bottom of the Basic Information box, e.g. 'Figure Head'."
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: text, required: false }

      # ── Cita de cabecera, pintada como conversación de chat ──
      # Gods, Energies, Powers y Transformations comparten esta ficha, así que
      # el campo se define aquí una vez y las demás lo reutilizan con *quote.
      - &quote
        name: quote
        label: Quote (chat)
        widget: list
        required: false
        label_singular: Message
        summary: "{{fields.speaker}}: {{fields.text}}"
        hint: "Shown at the top of this entry's own page as a chat. Each character keeps the same side, in the order they first speak."
        fields:
          - { name: speaker, label: Character, widget: string }
          - { name: avatar, label: Avatar, widget: image, required: false, hint: "Square images look best. Without one, the initial is shown instead." }
          - { name: text, label: Message, widget: text }

      # ── Bloques de contenido de la ficha (mismos tipos que en Countries) ──
      # Igual que la cita: se define aquí y Energies, Powers y Transformations
      # lo reutilizan con *blocks.
      - &blocks
        name: blocks
        label: Content blocks
        widget: list
        required: false
        label_singular: Block
        summary: "{{fields.title}}"
        hint: "The sections of this entry's own page, in order. Each one gets a divider above it, and the Contents list is built from their titles."
        fields:
          - { name: title, label: Title, widget: string, hint: "Also the entry in the Contents list." }
          - { name: icon, label: Icon, widget: image, required: false, hint: "Shown in the circle next to the title. Square images look best." }
          - name: parts
            label: Content
            widget: list
            required: false
            label_singular: Part
            hint: "Build the block by adding parts, in order: text, text with an image beside it, or just an image."
            types:
              - name: text
                label: Text
                widget: object
                summary: "Text: {{fields.text}}"
                fields:
                  - { name: text, label: Text, widget: text, hint: "Leave a blank line between paragraphs." }

              - name: textImage
                label: Text + image
                widget: object
                summary: "Text + image: {{fields.text}}"
                fields:
                  - { name: text, label: Text, widget: text, hint: "Leave a blank line between paragraphs." }
                  - { name: image, label: Image, widget: image }
                  - { name: caption, label: Caption, widget: string, required: false }
                  - name: imageSide
                    label: Image side
                    widget: select
                    options: [right, left]
                    default: right
                    hint: "Which side of the text the image sits on."

              - name: image
                label: Image
                widget: object
                summary: "Image: {{fields.caption}}"
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: caption, label: Caption, widget: string, required: false }

  # ───────────────────────── Energies ─────────────────────────
  - name: energy
    label: Energies
    label_singular: Energy
    folder: src/content/energy
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/energy
    public_folder: /energy
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: name, label: Name, widget: string }
      - { name: custom, label: "Is this a custom (player-made) energy?", widget: boolean, required: false, default: false }
      - { name: icon, label: Icon, widget: image, required: false }
      - { name: background, label: Background, widget: image, required: false }
      - { name: backgroundPosition, label: "Background position (CSS)", widget: string, required: false, hint: "e.g. 'center 30%'" }
      - { name: backgroundZoom, label: "Background zoom", widget: number, value_type: float, required: false, hint: "e.g. 1.05" }
      - { name: summary, label: Summary, widget: text, required: false, hint: "Shown inside the accordion. Leave a blank line between paragraphs." }
      - { name: description, label: Description, widget: text, required: false, hint: "Intro of this entry's own page, above the sections. Leave a blank line between paragraphs." }

      - *quote
      - *blocks

  # ───────────────────────── Powers ─────────────────────────
  - name: powers
    label: Powers
    label_singular: Power
    folder: src/content/powers
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/powers
    public_folder: /powers
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: name, label: Name, widget: string }
      - { name: custom, label: "Is this a custom (player-made) power?", widget: boolean, required: false, default: false, hint: "Custom ones are listed apart, under the canon ones." }
      - { name: icon, label: Icon, widget: image, required: false }
      - { name: background, label: Background, widget: image, required: false }
      - { name: summary, label: Summary, widget: text, required: false, hint: "Shown inside the accordion. Leave a blank line between paragraphs." }
      - { name: description, label: Description, widget: text, required: false, hint: "Intro of this entry's own page, above the sections. Leave a blank line between paragraphs." }
      - *quote
      - *blocks

  # ───────────────────────── Transformations ─────────────────────────
  - name: transformations
    label: Transformations
    label_singular: Transformation
    folder: src/content/transformations
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/transformations
    public_folder: /transformations
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: name, label: Name, widget: string }
      - { name: custom, label: "Is this a custom (player-made) transformation?", widget: boolean, required: false, default: false, hint: "Custom ones are listed apart, under the canon ones." }
      - { name: icon, label: Icon, widget: image, required: false }
      - { name: background, label: Background, widget: image, required: false }
      - { name: summary, label: Summary, widget: text, required: false, hint: "Shown inside the accordion. Leave a blank line between paragraphs." }
      - { name: description, label: Description, widget: text, required: false, hint: "Intro of this entry's own page, above the sections. Leave a blank line between paragraphs." }
      - *quote
      - *blocks

  # ───────────────────────── Worlds ─────────────────────────
  - name: worlds
    label: Worlds
    label_singular: World
    folder: src/content/worlds
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/worlds
    public_folder: /worlds
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: name, label: Name, widget: string }
      - { name: image, label: Image, widget: image, required: false }
      - { name: presentation, label: Presentation, widget: text, required: false }
      - { name: map, label: Map, widget: image, required: false }
      - name: countryGroups
        label: Country groups
        widget: list
        required: false
        label_singular: Group
        summary: "{{fields.label}} ({{fields.count}})"
        fields:
          - { name: id, label: ID, widget: string }
          - { name: label, label: Label, widget: string }
          - { name: placeholderLabel, label: "Placeholder label", widget: string }
          - { name: count, label: Count, widget: number, value_type: int }

  # ───────────────────────── Countries ─────────────────────────
  - name: countries
    label: Countries
    label_singular: Country
    folder: src/content/countries
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.name}} — {{fields.world}} / {{fields.group}}"
    media_folder: /public/worlds
    public_folder: /worlds
    fields:
      - { name: order, label: Order, widget: number, value_type: int, hint: "Position within its group" }
      - name: world
        label: World
        widget: select
        options: [mobius, moebius, sol, future-200]
        default: mobius
        hint: "Which world's page this country appears on"
      - name: group
        label: Group
        widget: select
        options: [main, secondary, territory, safe, missing]
        default: main
        hint: "Must be a group that exists in the chosen world (Mobius: main / secondary / territory · Moebius and Sol: main · 200 Years Future: safe / missing). If it doesn't match, the country won't show up."
      - { name: name, label: Name, widget: string, hint: "Also the heading of the Basic Information box." }
      - { name: flag, label: Flag, widget: image, required: false, hint: "Shown inside the Basic Information box and on the world page card." }
      - { name: background, label: Background, widget: image, required: false, hint: "Full-page background for this country's own page." }
      - { name: color, label: "Accent color", widget: color, required: false, hint: "Tints the frame, the title and the Basic Information box on this country's own page. Empty keeps the site's magenta." }

      # ── Cita de cabecera, pintada como conversación de chat ──
      - name: quote
        label: Quote (chat)
        widget: list
        required: false
        label_singular: Message
        summary: "{{fields.speaker}}: {{fields.text}}"
        hint: "Shown at the top of the page as a chat. Each character keeps the same side, in the order they first speak."
        fields:
          - { name: speaker, label: Character, widget: string }
          - { name: avatar, label: Avatar, widget: image, required: false, hint: "Square images look best. Without one, the initial is shown instead." }
          - { name: text, label: Message, widget: text }

      # ── Basic Information (las 5 filas fijas del infobox) ──
      # Si se deja vacío, la fila sale como "N/A" en lugar de desaparecer.
      - { name: continent, label: Continent, widget: string, required: false }
      - { name: capital, label: Capital, widget: string, required: false }
      - name: otherCities
        label: Other Cities
        widget: list
        required: false
        field: { name: city, label: City, widget: string }
        hint: "One per line. Add notes in brackets if you like, e.g. 'Robotropolis (Eggman Army HQ)'."
      - name: majorOrganizations
        label: Major Organizations
        widget: list
        required: false
        field: { name: organization, label: Organization, widget: string }
      - name: minorOrganizations
        label: Minor Organizations
        widget: list
        required: false
        field: { name: organization, label: Organization, widget: string }

      # ── Bloques de contenido de la ficha ──
      - name: blocks
        label: Content blocks
        widget: list
        required: false
        label_singular: Block
        summary: "{{fields.title}}"
        hint: "The sections of the page, in order. Each one gets a divider above it, and the Contents list is built from their titles."
        fields:
          - { name: title, label: Title, widget: string, hint: "Also the entry in the Contents list." }
          - { name: icon, label: Icon, widget: image, required: false, hint: "Shown in the circle next to the title. Square images look best." }
          # El cuerpo del bloque se compone de partes, y cada una es de un tipo.
          # Al pulsar "Add" el CMS pregunta qué tipo de parte se quiere añadir.
          - name: parts
            label: Content
            widget: list
            required: false
            label_singular: Part
            hint: "Build the block by adding parts, in order: text, text with an image beside it, or just an image."
            types:
              - name: text
                label: Text
                widget: object
                summary: "Text: {{fields.text}}"
                fields:
                  - { name: text, label: Text, widget: text, hint: "Leave a blank line between paragraphs." }

              - name: textImage
                label: Text + image
                widget: object
                summary: "Text + image: {{fields.text}}"
                fields:
                  - { name: text, label: Text, widget: text, hint: "Leave a blank line between paragraphs." }
                  - { name: image, label: Image, widget: image }
                  - { name: caption, label: Caption, widget: string, required: false }
                  - name: imageSide
                    label: Image side
                    widget: select
                    options: [right, left]
                    default: right
                    hint: "Which side of the text the image sits on."

              - name: image
                label: Image
                widget: object
                summary: "Image: {{fields.caption}}"
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: caption, label: Caption, widget: string, required: false }

              - name: regions
                label: Regions
                widget: object
                summary: "Regions"
                fields:
                  - { name: map, label: Map of the country, widget: image, required: false }
                  - { name: mapCaption, label: Map caption, widget: string, required: false }
                  - name: regions
                    label: Regions
                    widget: list
                    required: false
                    label_singular: Region
                    summary: "{{fields.title}}"
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: description, label: Description, widget: text, required: false, hint: "Leave a blank line between paragraphs." }
                      - name: locations
                        label: Locations
                        widget: list
                        required: false
                        label_singular: Location
                        summary: "{{fields.name}}"
                        hint: "Shown as a row of pictures you can scroll. Give a location a description and readers can click it to open it."
                        fields:
                          - { name: name, label: Name, widget: string }
                          - { name: image, label: Image, widget: image, required: false }
                          - { name: description, label: Description, widget: text, required: false, hint: "Opens when the picture is clicked. Without one, the picture isn't clickable." }

      # ── Filas extra, para lo que no cabe en las fijas ──
      - *extra_info

  # ───────────────────────── Side worlds ─────────────────────────
  - name: side-worlds
    label: Side worlds
    label_singular: Side world
    folder: src/content/side-worlds
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}}"
    media_folder: /public/worlds
    public_folder: /worlds
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: name, label: Name, widget: string }
      - { name: image, label: Image, widget: image, required: false }

  # ───────────────────────── Lore (section index) ─────────────────────────
  - name: lore
    label: Lore (sections)
    label_singular: Lore section
    folder: src/content/lore
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: "{{fields.order}} · {{fields.title}}"
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: title, label: Title, widget: string }
      - { name: route, label: "Route (optional)", widget: string, required: false, hint: "e.g. /lore/gods. Leave empty if it doesn't link anywhere." }
      - { name: description, label: Description, widget: text, required: false }
